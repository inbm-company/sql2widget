services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent4any}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent4any}
      POSTGRES_DB: ${POSTGRES_DB:-agent4any}
    ports:
      - "5434:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent4any} -d ${POSTGRES_DB:-agent4any}"]
      interval: 3s
      timeout: 5s
      retries: 20

  db-customer:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent4any}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent4any}
      POSTGRES_DB: ${CUSTOMER_POSTGRES_DB:-agent4any_customer_demo}
    ports:
      - "5436:5432"
    volumes:
      - pg_customer_data:/var/lib/postgresql/data
      - ./backend/sql/sample_customer:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent4any} -d ${CUSTOMER_POSTGRES_DB:-agent4any_customer_demo}"]
      interval: 3s
      timeout: 5s
      retries: 20

  db-stage-global:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent4any}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent4any}
      POSTGRES_DB: ${STAGE_GLOBAL_POSTGRES_DB:-agent4any_stage_global}
    ports:
      - "5435:5432"
    volumes:
      - pg_stage_global_data:/var/lib/postgresql/data
      - ./backend/sql/stage_global:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent4any} -d ${STAGE_GLOBAL_POSTGRES_DB:-agent4any_stage_global}"]
      interval: 3s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-agent4any}:${POSTGRES_PASSWORD:-agent4any}@db:5432/${POSTGRES_DB:-agent4any}
      DEMO_CUSTOMER_DATABASE_URL: postgresql://${POSTGRES_USER:-agent4any}:${POSTGRES_PASSWORD:-agent4any}@db-customer:5432/${CUSTOMER_POSTGRES_DB:-agent4any_customer_demo}
      STAGE_GLOBAL_DATABASE_URL: postgresql://${POSTGRES_USER:-agent4any}:${POSTGRES_PASSWORD:-agent4any}@db-stage-global:5432/${STAGE_GLOBAL_POSTGRES_DB:-agent4any_stage_global}
      APP_SECRET: ${APP_SECRET:-dev-secret-replace-with-at-least-32-chars!!}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
      # Host API is published on 8010 (8001 often taken by other local apps)
    ports:
      - "8010:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      db-customer:
        condition: service_healthy
      db-stage-global:
        condition: service_healthy
    command: >
      sh -c "python scripts/migrate.py &&
             python scripts/migrate_customer.py &&
             python scripts/migrate_stage_global.py &&
             python scripts/seed_dev.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE: http://127.0.0.1:8010
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  pg_data:
  pg_customer_data:
  pg_stage_global_data:
  frontend_node_modules:
