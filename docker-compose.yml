name: sql2widget-local
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent4any}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent4any}
      POSTGRES_DB: ${POSTGRES_DB:-agent4any}
    ports:
      - "${SERVICE_DB_PORT:-5544}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent4any} -d ${POSTGRES_DB:-agent4any}"]
      interval: 3s
      timeout: 5s
      retries: 20

  db-customer:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent4any}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent4any}
      POSTGRES_DB: ${CUSTOMER_POSTGRES_DB:-agent4any_customer_demo}
    ports:
      - "${CUSTOMER_DB_PORT:-5546}:5432"
    volumes:
      - pg_customer_data:/var/lib/postgresql/data
      - ./backend/sql/sample_customer:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent4any} -d ${CUSTOMER_POSTGRES_DB:-agent4any_customer_demo}"]
      interval: 3s
      timeout: 5s
      retries: 20

  db-stage-global:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent4any}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent4any}
      POSTGRES_DB: ${STAGE_GLOBAL_POSTGRES_DB:-agent4any_stage_global}
    ports:
      - "${GLOBAL_DB_PORT:-5547}:5432"
    volumes:
      - pg_stage_global_data:/var/lib/postgresql/data
      - ./backend/sql/stage_global:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent4any} -d ${STAGE_GLOBAL_POSTGRES_DB:-agent4any_stage_global}"]
      interval: 3s
      timeout: 5s
      retries: 20

  db-northwind:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent4any}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent4any}
      POSTGRES_DB: ${NORTHWIND_POSTGRES_DB:-agent4any_northwind}
    ports:
      - "${NORTHWIND_DB_PORT:-5548}:5432"
    volumes:
      - pg_northwind_data:/var/lib/postgresql/data
      - ./backend/sql/northwind:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent4any} -d ${NORTHWIND_POSTGRES_DB:-agent4any_northwind}"]
      interval: 3s
      timeout: 5s
      retries: 20

  db-skax-nms:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent4any}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent4any}
      POSTGRES_DB: ${SKAX_NMS_POSTGRES_DB:-agent4any_skax_nms}
    ports:
      - "${SKAX_DB_PORT:-5549}:5432"
    volumes:
      - pg_skax_nms_data:/var/lib/postgresql/data
      - ./backend/sql/skax_nms:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # The temporary init server only accepts Unix sockets while restoring the dump.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-agent4any} -d ${SKAX_NMS_POSTGRES_DB:-agent4any_skax_nms}"]
      interval: 3s
      timeout: 5s
      retries: 20

  db-chat-vector:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent4any}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent4any}
      POSTGRES_DB: ${CHAT_VECTOR_POSTGRES_DB:-agent4any_chat_vector}
    ports:
      - "${VECTOR_DB_PORT:-5550}:5432"
    volumes:
      - pg_chat_vector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent4any} -d ${CHAT_VECTOR_POSTGRES_DB:-agent4any_chat_vector}"]
      interval: 3s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env.local
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-agent4any}:${POSTGRES_PASSWORD:-agent4any}@db:5432/${POSTGRES_DB:-agent4any}
      DEMO_CUSTOMER_DATABASE_URL: postgresql://${POSTGRES_USER:-agent4any}:${POSTGRES_PASSWORD:-agent4any}@db-customer:5432/${CUSTOMER_POSTGRES_DB:-agent4any_customer_demo}
      STAGE_GLOBAL_DATABASE_URL: postgresql://${POSTGRES_USER:-agent4any}:${POSTGRES_PASSWORD:-agent4any}@db-stage-global:5432/${STAGE_GLOBAL_POSTGRES_DB:-agent4any_stage_global}
      NORTHWIND_DATABASE_URL: postgresql://${POSTGRES_USER:-agent4any}:${POSTGRES_PASSWORD:-agent4any}@db-northwind:5432/${NORTHWIND_POSTGRES_DB:-agent4any_northwind}
      SKAX_NMS_DATABASE_URL: postgresql://${POSTGRES_USER:-agent4any}:${POSTGRES_PASSWORD:-agent4any}@db-skax-nms:5432/${SKAX_NMS_POSTGRES_DB:-agent4any_skax_nms}
      CHAT_VECTOR_DATABASE_URL: postgresql://${POSTGRES_USER:-agent4any}:${POSTGRES_PASSWORD:-agent4any}@db-chat-vector:5432/${CHAT_VECTOR_POSTGRES_DB:-agent4any_chat_vector}
      CHAT_EMBEDDING_DIM: ${CHAT_EMBEDDING_DIM:-1536}
      GRAPH_ENABLED: "false"
      APP_SECRET: ${APP_SECRET:-dev-secret-replace-with-at-least-32-chars!!}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:5175,http://localhost:5175}
      # 독립 로컬 API 포트는 기본 8011
    ports:
      - "${API_PORT:-8011}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      db-customer:
        condition: service_healthy
      db-stage-global:
        condition: service_healthy
      db-northwind:
        condition: service_healthy
      db-skax-nms:
        condition: service_healthy
      db-chat-vector:
        condition: service_healthy
    command: >
      sh -c "python scripts/migrate.py &&
             python scripts/migrate_customer.py &&
             python scripts/migrate_stage_global.py &&
             python scripts/migrate_northwind.py &&
             python scripts/migrate_chat_vector.py &&
             python scripts/seed_dev.py &&
             python scripts/seed_skax_nms.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE: http://127.0.0.1:${API_PORT:-8011}
    ports:
      - "${FRONTEND_PORT:-5175}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  pg_data:
  pg_customer_data:
  pg_stage_global_data:
  pg_northwind_data:
  pg_skax_nms_data:
  pg_chat_vector_data:
  frontend_node_modules:
