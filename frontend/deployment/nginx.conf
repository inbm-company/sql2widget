server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }
    # 공개 문서 주소는 파일명 없이 제공한다.
    location = /kanban {
        alias /usr/share/nginx/html/docs/kanban.html;
        default_type text/html;
    }
    location = /docs {
        alias /usr/share/nginx/html/docs/dashboard.html;
        default_type text/html;
    }
    location = /docs/kanban.html {
        absolute_redirect off;
        return 301 /kanban$is_args$args;
    }
    location = /docs/dashboard.html {
        absolute_redirect off;
        return 301 /docs$is_args$args;
    }
    location = /kanban/ {
        absolute_redirect off;
        return 301 /kanban$is_args$args;
    }
    location = /docs/ {
        absolute_redirect off;
        return 301 /docs$is_args$args;
    }
    # 문서 업로드(최대 20 MiB 본문)만 요청 크기 제한을 넓힌다.
    location ~ ^/api/projects/[^/]+/graph-sources {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        client_max_body_size 32m;
    }
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 180s;
        client_max_body_size 1m;
    }
    location / { try_files $uri $uri/ /index.html; }
}
